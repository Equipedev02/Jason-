<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>DAVBOT Business - Profil</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#020817;
    color:white;
    font-family:Inter,sans-serif;
    padding-bottom:100px;
}

.container{
    max-width:700px;
    margin:auto;
    padding:25px 20px;
}

.profile{
    text-align:center;
    padding:30px;
    background:linear-gradient(135deg,#061d40,#061329);
    border:1px solid #174271;
    border-radius:25px;
}

.avatar{
    width:100px;
    height:100px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid #087cff;
    margin-bottom:15px;
}

.email{
    color:#8fa6c7;
    font-size:13px;
}

.stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    margin-top:20px;
}

.box{
    padding:20px;
    background:#061329;
    border:1px solid #12345e;
    border-radius:18px;
}

.box small{
    color:#8ea4c5;
}

.value{
    display:block;
    font-size:23px;
    font-weight:800;
    margin-top:8px;
}

.referral{
    margin-top:20px;
    padding:20px;
    background:#071832;
    border:1px solid #16406f;
    border-radius:18px;
}

.code{
    margin-top:12px;
    padding:15px;
    background:#020817;
    border-radius:12px;
    color:#4da5ff;
    font-size:20px;
    font-weight:800;
    text-align:center;
    letter-spacing:1px;
}

button{
    width:100%;
    border:0;
    padding:14px;
    border-radius:13px;
    margin-top:12px;
    font-weight:800;
    cursor:pointer;
}

.recharge{
    background:#087cff;
    color:#fff;
}

.withdraw{
    background:#122744;
    color:#fff;
}

.logout{
    background:#251323;
    color:#ff7188;
}

.nav{
    position:fixed;
    bottom:15px;
    left:50%;
    transform:translateX(-50%);
    width:calc(100% - 30px);
    max-width:600px;
    background:rgba(5,20,43,.95);
    border:1px solid #194272;
    border-radius:20px;
    display:flex;
    justify-content:space-around;
    padding:10px;
}

.nav a{
    color:#91a7c6;
    text-decoration:none;
    padding:10px;
    font-size:12px;
}

</style>

</head>

<body>

<main class="container">

<section class="profile">

<img
    id="profilePhoto"
    class="avatar"
    src="https://via.placeholder.com/100"
>

<h2 id="profileName">
    Chargement...
</h2>

<div class="email" id="profileEmail"></div>

</section>

<section class="stats">

<div class="box">
    <small>Solde</small>
    <span class="value">
        <span id="profileBalance">0</span> FC
    </span>
</div>

<div class="box">
    <small>Points fidélité</small>
    <span class="value" id="profilePoints">
        0
    </span>
</div>

</section>

<section class="referral">

<h3>🎁 Parrainage</h3>

<p style="color:#8fa6c7;margin-top:8px;font-size:13px;">
Partage ton code. Lorsqu'une nouvelle personne
crée son compte avec ton code, tu gagnes des points.
</p>

<div class="code" id="referralCode">
    ...
</div>

<button id="copyReferral">
    Copier mon code
</button>

</section>

<button class="recharge" id="rechargeBtn">
    + Demander une recharge
</button>

<button class="withdraw" id="withdrawBtn">
    Retirer mon solde
</button>

<button class="logout" id="logoutBtn">
    Se déconnecter
</button>

</main>

<nav class="nav">

<a href="dash.html">Accueil</a>
<a href="shop.html">Boutique</a>
<a href="profil.html">Profil</a>

</nav>

<script type="module" src="./app.js"></script>

</body>

</html>
