<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>DAVBOT Business - Connexion</title>


<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">


<style>


*{

box-sizing:border-box;
margin:0;
padding:0;

}


body{

min-height:100vh;

background:
linear-gradient(
135deg,
#020817,
#061a38
);

font-family:Inter,sans-serif;

color:white;

display:flex;

align-items:center;

justify-content:center;

padding:20px;

}



.container{

width:100%;

max-width:450px;

}



.logo{

text-align:center;

margin-bottom:25px;

}



.logo h1{

font-size:34px;

font-weight:800;

color:#28a0ff;

}



.logo p{

color:#8da5c6;

margin-top:8px;

font-size:14px;

}



.card{

background:
rgba(6,19,41,.95);

border:

1px solid #12345e;

border-radius:25px;

padding:30px;

box-shadow:

0 20px 70px
rgba(0,0,0,.5);

}



.tabs{

display:flex;

gap:10px;

margin-bottom:25px;

}



.tabs button{

flex:1;

padding:12px;

border:0;

border-radius:12px;

cursor:pointer;

background:#0b2445;

color:white;

font-weight:700;

}



.tabs button.active{

background:#087cff;

}





.form{

display:none;

}



.form.active{

display:block;

}



h2{

margin-bottom:20px;

font-size:22px;

}



.input{

margin-bottom:15px;

}



label{

display:block;

font-size:13px;

color:#9bb1d0;

margin-bottom:7px;

}



input{

width:100%;

padding:14px;

border-radius:12px;

border:

1px solid #204875;

background:#030d20;

color:white;

outline:none;

}



input:focus{

border-color:#087cff;

}




.file{

background:#071832;

padding:12px;

border-radius:12px;

}



.submit{

width:100%;

padding:15px;

border:0;

border-radius:14px;

background:

linear-gradient(
135deg,
#087cff,
#0054c7
);

color:white;

font-weight:800;

font-size:15px;

cursor:pointer;

margin-top:10px;

}



.forgot{

text-align:center;

margin-top:15px;

}



.forgot a{

color:#39a2ff;

cursor:pointer;

font-size:14px;

}



.info{

margin-top:20px;

padding:15px;

border-radius:15px;

background:#071832;

color:#9cb4d4;

font-size:13px;

line-height:1.6;

}



</style>


</head>



<body>



<div class="container">



<div class="logo">

<h1>
JASON 
</h1>

<p>
Business Digital Platform
</p>

</div>





<div class="card">





<div class="tabs">


<button 
id="loginTab"
class="active">

Connexion

</button>


<button 
id="registerTab">

Créer un compte

</button>


</div>







<!-- =========================
CONNEXION
========================= -->


<form 
id="loginForm"
class="form active">



<h2>
Connexion
</h2>



<div class="input">

<label>
Adresse email
</label>

<input

id="loginEmail"

type="email"

placeholder="email@gmail.com"

required>

</div>




<div class="input">

<label>
Mot de passe
</label>


<input

id="loginPassword"

type="password"

placeholder="********"

required>


</div>





<button class="submit">

Se connecter

</button>





<div class="forgot">

<a id="forgotPassword">

Mot de passe oublié ?

</a>

</div>



</form>









<!-- =========================
INSCRIPTION
========================= -->


<form

id="registerForm"

class="form">





<h2>
Créer un compte
</h2>




<div class="input">

<label>
Nom complet
</label>


<input

id="registerName"

type="text"

placeholder="Votre nom"

required>


</div>







<div class="input">

<label>
Adresse email
</label>


<input

id="registerEmail"

type="email"

placeholder="email@gmail.com"

required>


</div>







<div class="input">


<label>
Photo de profil
</label>


<input

id="registerPhoto"

class="file"

type="file"

accept="image/*">


</div>







<div class="input">


<label>
Mot de passe
</label>


<input

id="registerPassword"

type="password"

placeholder="Minimum 6 caractères"

required>


</div>







<div class="input">


<label>
Confirmation mot de passe
</label>


<input

id="registerConfirm"

type="password"

placeholder="Confirmer"

required>


</div>







<div class="input">


<label>

Code parrain 
(optionnel)

</label>


<input

id="registerReferral"

type="text"

placeholder="Jason-XXXXXX">


</div>








<button class="submit">

Créer mon compte

</button>





</form>







<div class="info">

🚀 Rejoignez Jason Business.

<br><br>

Gagnez des points fidélité grâce au parrainage.

<br><br>

Vos services, commandes et soldes sont gérés depuis votre espace personnel.

</div>





</div>





</div>









<script>


const loginTab =
document.getElementById(
"loginTab"
);


const registerTab =
document.getElementById(
"registerTab"
);



const forms =
document.querySelectorAll(
".form"
);



loginTab.onclick =
()=>{


loginTab.classList.add(
"active"
);


registerTab.classList.remove(
"active"
);



forms.forEach(
form=>form.classList.remove(
"active"
)
);



document
.getElementById(
"loginForm"
)
.classList.add(
"active"
);



};






registerTab.onclick =
()=>{


registerTab.classList.add(
"active"
);


loginTab.classList.remove(
"active"
);



forms.forEach(
form=>form.classList.remove(
"active"
)
);



document
.getElementById(
"registerForm"
)
.classList.add(
"active"
);



};






</script>





<script 
type="module"
src="./app.js">
</script>



</body>

</html>
