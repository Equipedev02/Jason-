    --blue:#00d2ff;
    --blue2:#0077ff;
    --dark:#050a14;

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:"Segoe UI",Arial,sans-serif;
    color:white;

    background:
        linear-gradient(
            rgba(3,8,18,.82),
            rgba(3,8,18,.95)

        center/cover fixed;

    min-height:100vh;
    padding-bottom:90px;
}


/* =========================
   HEADER
========================= */

.header{

    padding:25px 18px;

    text-align:center;

    background:
        rgba(0,0,0,.55);

    border-bottom:
        1px solid
        rgba(0,210,255,.35);

    backdrop-filter:blur(18px);

}

.logo{

    color:var(--blue);

    font-size:23px;

    font-weight:900;

    letter-spacing:3px;

}

.subtitle{

    margin-top:6px;

    font-size:12px;

    opacity:.65;

}

.balance{

    display:inline-block;

    margin-top:15px;

    padding:9px 18px;

    border-radius:20px;

    background:
        rgba(0,210,255,.08);

    border:
        1px solid
        rgba(0,210,255,.3);

    color:var(--blue);

    font-size:13px;

    font-weight:bold;

}


/* =========================
   CONTAINER
========================= */

.container{

    width:100%;

    max-width:700px;

    margin:auto;

    padding:20px;

}

.section-title{

    font-size:17px;

    margin:5px 0 16px;

    letter-spacing:1px;

}


/* =========================
   SERVICES
========================= */

.services{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:12px;

}

.service-card{

    background:
        var(--card);

    border:
        1px solid
        rgba(0,210,255,.12);

    border-radius:19px;

    padding:17px;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.25);

    backdrop-filter:blur(12px);

    transition:.2s;

}

.service-card:active{

    transform:scale(.97);

}

.service-icon{

    width:48px;

    height:48px;

    display:flex;

    justify-content:center;

    align-items:center;

    border-radius:14px;

    background:
        rgba(0,210,255,.10);

    border:
        1px solid
        rgba(0,210,255,.2);

    font-size:25px;

    margin-bottom:12px;

}

.service-name{

    color:var(--blue);

    font-weight:900;

    font-size:15px;

}

.service-desc{

    font-size:11px;

    opacity:.62;

    line-height:1.45;

    min-height:32px;

    margin-top:5px;

}

.service-price{

    margin-top:12px;

    font-size:17px;

    font-weight:900;

}

.buy-btn{

    width:100%;

    margin-top:12px;

    padding:11px;

    border:0;

    border-radius:10px;

    background:var(--blue);

    color:#001018;

    font-weight:900;

    cursor:pointer;

    font-size:12px;

}

.buy-btn:active{

    transform:scale(.96);

}


/* =========================
   MODAL
========================= */

.modal{

    position:fixed;

    inset:0;

    background:
        rgba(0,0,0,.78);

    z-index:2000;

    display:none;

    align-items:center;

    justify-content:center;

    padding:15px;

}

.modal.show{

    display:flex;

}

.modal-box{

    width:100%;

    max-width:500px;

    max-height:
        92vh;

    overflow-y:auto;

    background:
        #07101e;

    border:
        1px solid
        var(--blue);

    border-radius:23px;

    padding:22px;

    box-shadow:
        0 0 35px
        rgba(0,210,255,.25);

.modal-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:18px;

}

.modal-title{

    color:var(--blue);

    font-size:19px;

    font-weight:900;

}

.close{

    width:35px;

    height:35px;

    border-radius:50%;

    border:1px solid #444;

    background:#111;

    color:white;

    cursor:pointer;

    font-size:18px;

}


/* =========================
   FORM
========================= */

.form-group{

    margin-bottom:13px;

}

.form-group label{

    display:block;

    font-size:12px;

    opacity:.75;

    margin-bottom:6px;

.form-group input,
.form-group textarea,
.form-group select{

    width:100%;

    padding:13px;

    border-radius:11px;

    border:
        1px solid
        rgba(255,255,255,.12);

    color:white;

    outline:none;

    font-family:inherit;

.form-group textarea{

.form-group input:focus,

/* ==========================================
   FORMAT
========================================== */

function formatFC(value){

    return Math.floor(
        Number(value) || 0
    ).toLocaleString("fr-FR");

}


/* ==========================================
   AFFICHAGE SOLDE
========================================== */

onValue(

    userRef,

    snapshot=>{

        if(!snapshot.exists())
            return;


        const data =
            snapshot.val();


        currentBalance =
            Number(
                data.solde_principal
            ) || 0;


        document.getElementById(
            "balance"
        ).innerText =
            formatFC(
                currentBalance
            );

    }

);


/* ==========================================
   AFFICHER SERVICES
========================================== */

const servicesContainer =
    document.getElementById(
        "servicesContainer"
    );


services.forEach(service=>{

    const card =
        document.createElement("div");


    card.className =
        "service-card";


    card.innerHTML = `

        <div class="service-icon">
            ${service.icon}
        </div>

        <div class="service-name">
            ${service.name}
        </div>

        <div class="service-desc">
            ${service.description}
        </div>

        <div class="service-price">
            ${formatFC(service.price)} FC
        </div>

        <button
            class="buy-btn"
            data-id="${service.id}">

            COMMANDER

        </button>

    `;


    servicesContainer.appendChild(card);

});


/* ==========================================
   OUVRIR FORMULAIRE
========================================== */

servicesContainer
.addEventListener(
    "click",
    event=>{

        const button =
            event.target.closest(
                ".buy-btn"
            );


        if(!button)
            return;


        const service =
            services.find(
                item =>
                item.id ===
                button.dataset.id
            );


        if(!service)
            return;


        selectedService =
            service;


        openOrderForm(service);

    }
);


/* ==========================================
   CREATION DU FORMULAIRE
========================================== */

function openOrderForm(service){

    document.getElementById(
        "modalTitle"
    ).innerText =
        "Commander — " +
        service.name;


    document.getElementById(
        "summaryService"
    ).innerText =
        service.name;


    document.getElementById(
        "summaryPrice"
    ).innerText =
        formatFC(service.price);


    document.getElementById(
        "summaryBalance"
    ).innerText =
        formatFC(currentBalance);


    const fields =
        document.getElementById(
            "dynamicFields"
        );


    fields.innerHTML = "";


    service.fields.forEach(field=>{

        const group =
            document.createElement(
                "div"
            );


        group.className =
            "form-group";


        let inputHTML = "";


        if(field.type === "textarea"){

            inputHTML = `

                <textarea
                    name="${field.name}"
                    placeholder="${field.placeholder || ""}"
                    ${field.required ? "required" : ""}
                ></textarea>

            `;

        }

        else if(field.type === "select"){

            inputHTML = `

                <select
                    name="${field.name}"
                    ${field.required ? "required" : ""}
                >

                    <option value="">
                        Sélectionner
                    </option>

                    ${
                        field.options
                        .map(option=>`
                            <option value="${option}">
                                ${option}
                            </option>
                        `)
                        .join("")
                    }

                </select>

            `;

        }

        else{

            inputHTML = `

                <input
                    type="${field.type}"
                    name="${field.name}"
                    placeholder="${field.placeholder || ""}"
                    ${field.required ? "required" : ""}
                >

            `;

        }


        group.innerHTML = `

            <label>
                ${field.label}
                ${field.required ? "*" : ""}
            </label>

            ${inputHTML}

        `;


        fields.appendChild(group);

    });


    document.getElementById(
        "orderStatus"
    ).innerText = "";


    document.getElementById(
        "orderModal"
    ).classList.add("show");

}


/* ==========================================
   FERMER
========================================== */

function closeModal(){

    document.getElementById(
        "orderModal"
    ).classList.remove("show");

    selectedService =
        null;

}


document.getElementById(
    "closeModal"
).onclick =
    closeModal;


document.getElementById(
    "orderModal"
).addEventListener(
    "click",
    event=>{

        if(
            event.target.id ===
            "orderModal"
        ){

            closeModal();

        }

    }
);


/* ==========================================
   ENVOYER COMMANDE
========================================== */

document.getElementById(
    "orderForm"
).addEventListener(
    "submit",
    async event=>{

        event.preventDefault();


        if(!selectedService)
            return;


        const status =
            document.getElementById(
                "orderStatus"
            );


        const button =
            document.getElementById(
                "submitOrder"
            );


        button.disabled =
            true;


        button.innerText =
            "⏳ TRAITEMENT...";


        status.className =
            "status";


        status.innerText =
            "Vérification du solde...";


        try{

            /*
             * ==========================
             * TRANSACTION SOLDE
             * ==========================
             *
             * Le prix est retiré
             * de manière atomique.
             */

            const transactionResult =
                await runTransaction(
                    userRef,
                    data=>{

                        if(data === null){

                            return;

                        }


                        const balance =
                            Number(
                                data.solde_principal
                            ) || 0;


                        if(
                            balance <
                            selectedService.price
                        ){

                            return;

                        }


                        data.solde_principal =
                            balance -
                            selectedService.price;


                        return data;

                    }
                );


            if(
                !transactionResult.committed
            ){

                throw new Error(
                    "SOLDE_INSUFFISANT"
                );

            }


            /* ==========================
               RECUPERATION FORMULAIRE
            ========================== */

            const formData =
                new FormData(
                    document.getElementById(
                        "orderForm"
                    )
                );


            const details = {};


            for(
                const [key,value]
                of formData.entries()
            ){

                details[key] =
                    String(value).trim();

            }


            /* ==========================
               CREATION COMMANDE
            ========================== */

            const ordersRef =
                ref(
                    db,
                    "commandes"
                );


            const newOrder =
                push(
                    ordersRef
                );


            await set(
                newOrder,
                {

                    id:
                        newOrder.key,

                    telephone:
                        userPhone,

                    serviceId:
                        selectedService.id,

                    service:
                        selectedService.name,

                    prix:
                        selectedService.price,

                    details:
                        details,

                    statut:
                        "En attente",

                    date:
                        new Date().toISOString(),

                    remboursementEffectue:
                        false

                }
            );


            status.className =
                "status success";


            status.innerText =
                "✅ Commande envoyée à l'administration.";


            button.innerText =
                "COMMANDE ENVOYÉE";


            /*
             * Petite pause pour laisser
             * le message apparaître.
             */

            setTimeout(
                ()=>{

                    window.location.href =
                        "dashboard.html";

                },
                1400
            );


        }

        catch(error){

            console.error(
                "Erreur commande :",
                error
            );


            /*
             * Si la commande Firebase
             * n'a pas pu être créée après
             * le débit, il faut prévoir
             * une restauration du solde.
             *
             * On restaure ici le montant
             * pour éviter de débiter
             * l'utilisateur sans commande.
             */

            try{

                await runTransaction(
                    userRef,
                    data=>{

                        if(data === null)
                            return;


                        const balance =
                            Number(
                                data.solde_principal
                            ) || 0;


                        data.solde_principal =
                            balance +
                            selectedService.price;


                        return data;

                    }
                );

            }
            catch(refundError){

                console.error(
                    "Erreur remboursement :",
                    refundError
                );

            }


            status.className =
                "status error";


            if(
                error.message ===
                "SOLDE_INSUFFISANT"
            ){

                status.innerText =
                    "❌ Solde insuffisant. Rechargez votre compte.";

            }
            else{

                status.innerText =
                    "⚠️ Impossible d'envoyer la commande.";

            }


            button.disabled =
                false;


            button.innerText =
                "🛒 CONFIRMER LA COMMANDE";

        }

    }
);

</script>
