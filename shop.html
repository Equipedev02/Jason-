<style>

:root{
    --blue:#00d2ff;
    --blue2:#0077ff;
    --dark:#050a14;
    --card:rgba(8,15,28,.92);
    --green:#00e676;
    --red:#ff4757;
    --yellow:#ffd32a;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    font-family:"Segoe UI",Arial,sans-serif;
    color:white;

    background:
        linear-gradient(
            rgba(3,8,18,.84),
            rgba(3,8,18,.96)
        ),
        url("IMG_0870.jpeg")
        center/cover fixed;

    min-height:100vh;
    padding-bottom:90px;
}


/* =========================
   HEADER
========================= */

.header{

    padding:24px 18px;

    text-align:center;

    background:
        rgba(0,0,0,.58);

    border-bottom:
        1px solid
        rgba(0,210,255,.35);

    backdrop-filter:blur(18px);

    position:sticky;
    top:0;
    z-index:100;

}

.logo{

    color:var(--blue);

    font-size:23px;

    font-weight:900;

    letter-spacing:3px;

}

.subtitle{

    margin-top:6px;

    font-size:12px;

    opacity:.65;

}

.balance{

    display:inline-block;

    margin-top:15px;

    padding:9px 18px;

    border-radius:20px;

    background:
        rgba(0,210,255,.08);

    border:
        1px solid
        rgba(0,210,255,.3);

    color:var(--blue);

    font-size:13px;

    font-weight:bold;

}


/* =========================
   CONTAINER
========================= */

.container{

    width:100%;

    max-width:700px;

    margin:auto;

    padding:20px 14px;

}

.section-title{

    font-size:18px;

    margin:5px 0 17px;

    letter-spacing:1px;

}


/* =========================
   SERVICES
========================= */

.services{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:12px;

}

.service-card{

    background:
        var(--card);

    border:
        1px solid
        rgba(0,210,255,.14);

    border-radius:19px;

    padding:16px;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.25);

    backdrop-filter:blur(12px);

    transition:.2s;

}

.service-card:active{

    transform:scale(.97);

}

.service-icon{

    width:48px;

    height:48px;

    display:flex;

    justify-content:center;

    align-items:center;

    border-radius:14px;

    background:
        rgba(0,210,255,.10);

    border:
        1px solid
        rgba(0,210,255,.2);

    font-size:25px;

    margin-bottom:12px;

}

.service-name{

    color:var(--blue);

    font-weight:900;

    font-size:15px;

}

.service-desc{

    font-size:11px;

    opacity:.62;

    line-height:1.45;

    min-height:34px;

    margin-top:5px;

}

.service-price{

    margin-top:12px;

    font-size:17px;

    font-weight:900;

}

.buy-btn{

    width:100%;

    margin-top:12px;

    padding:11px;

    border:0;

    border-radius:10px;

    background:
        linear-gradient(
            135deg,
            var(--blue),
            var(--blue2)
        );

    color:white;

    font-weight:900;

    cursor:pointer;

    font-size:12px;

}

.buy-btn:active{

    transform:scale(.96);

}


/* =========================
   MODAL
========================= */

.modal{

    position:fixed;

    inset:0;

    background:
        rgba(0,0,0,.82);

    z-index:2000;

    display:none;

    align-items:center;

    justify-content:center;

    padding:15px;

}

.modal.show{

    display:flex;

}

.modal-box{

    width:100%;

    max-width:500px;

    max-height:92vh;

    overflow-y:auto;

    background:
        #07101e;

    border:
        1px solid
        var(--blue);

    border-radius:23px;

    padding:22px;

    box-shadow:
        0 0 35px
        rgba(0,210,255,.25);

.modal-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:18px;

}

.modal-title{

    color:var(--blue);

    font-size:19px;

    font-weight:900;

}

.close{

    width:35px;

    height:35px;

    border-radius:50%;

    border:1px solid #444;

    background:#111;

    color:white;

    cursor:pointer;

    font-size:18px;

}


/* =========================
   FORM
========================= */

.form-group{

    margin-bottom:13px;

}

.form-group label{

    display:block;

    font-size:12px;

    opacity:.75;

    margin-bottom:6px;

}

.form-group input,
.form-group textarea,
.form-group select{

    width:100%;

    padding:13px;

    border-radius:11px;

    border:
        1px solid
        rgba(255,255,255,.12);

    background:#03070d;

    color:white;

    outline:none;

    font-family:inherit;

    font-size:14px;

}

.form-group textarea{

    min-height:100px;

    resize:vertical;

}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{

    border-color:

/* =========================
   SUMMARY
========================= */

.order-summary{

    background:

        1px dashed

    padding:14px;

    margin-bottom:17px;

.summary-row{

    justify-content:space-between;

    font-size:13px;

    margin:7px 0;

}

.summary-row strong{

    color:var(--blue);

}

.insufficient{

    color:var(--red)!important;

/* =========================
   SUBMIT
========================= */

.submit-order{

    padding:15px;

    border:0;

    border-radius:12px;

.submit-order:disabled{

/* =========================

========================= */

.status{

.success{

.error{

.warning{

/* =========================

========================= */

.loading{

/* =========================
   NAVBAR
========================= */

.navbar{

.nav-link{

.nav-link span{

/* ==========================================
   FORMAT FC
========================================== */

function formatFC(value){

    return Math.floor(
        Number(value) || 0
    ).toLocaleString("fr-FR");

}


/* ==========================================
   AFFICHER SOLDE
========================================== */

onValue(

    userRef,

    snapshot=>{

        if(!snapshot.exists()){

            currentBalance = 0;

            document.getElementById(
                "balance"
            ).innerText = "0";

            return;

        }


        const data =
            snapshot.val();


        currentBalance =
            Number(
                data.solde_principal
            ) || 0;


        document.getElementById(
            "balance"
        ).innerText =
            formatFC(
                currentBalance
            );


        /*
         * Si le formulaire est ouvert,
         * mettre aussi le résumé à jour.
         */

        if(selectedService){

            updateSummary();

        }

    }

);

servicesContainer.addEventListener(

/* ==========================================
   OUVRIR FORMULAIRE
========================================== */

function openOrderForm(service){

    document.getElementById(
        "modalTitle"
    ).innerText =
        "Commander — " +
        service.name;


    document.getElementById(
        "summaryService"
    ).innerText =
        service.name;


    document.getElementById(
        "summaryPrice"
    ).innerText =
        formatFC(
            service.price
        );


    const fields =
        document.getElementById(
            "dynamicFields"
        );


    fields.innerHTML = "";


    service.fields.forEach(
        field=>{

            const group =
                document.createElement(
                    "div"
                );


            group.className =
                "form-group";


            let inputHTML = "";


            /* TEXTAREA */

            if(
                field.type ===
                "textarea"
            ){

                inputHTML = `

                    <textarea
                        name="${field.name}"
                        placeholder="${escapeHTML(field.placeholder || "")}"
                        ${field.required ? "required" : ""}
                    ></textarea>

                `;

            }


            /* SELECT */

            else if(
                field.type ===
                "select"
            ){

                inputHTML = `

                    <select
                        name="${field.name}"
                        ${field.required ? "required" : ""}
                    >

                        <option value="">
                            Sélectionner
                        </option>

                        ${
                            field.options
                            .map(
                                option=>`

                                <option
                                    value="${escapeHTML(option)}">

                                    ${escapeHTML(option)}

                                </option>

                                `
                            )
                            .join("")
                        }

                    </select>

                `;

            }


            /* INPUT */

            else{

                inputHTML = `

                    <input
                        type="${field.type}"
                        name="${field.name}"
                        placeholder="${escapeHTML(field.placeholder || "")}"
                        ${field.required ? "required" : ""}
                    >

                `;

            }


            group.innerHTML = `

                <label>

                    ${escapeHTML(field.label)}

                    ${field.required ? "*" : ""}

                </label>

                ${inputHTML}

            `;


            fields.appendChild(
                group
            );

        }
    );


    document.getElementById(
        "orderStatus"
    ).innerText = "";


    document.getElementById(
        "orderStatus"
    ).className =
        "status";


    document.getElementById(
        "submitOrder"
    ).disabled = false;


    document.getElementById(
        "submitOrder"
    ).innerText =
        "🛒 CONFIRMER LA COMMANDE";


    updateSummary();


    document.getElementById(
        "orderModal"
    ).classList.add(
        "show"
    );

}


/* ==========================================
   SECURISER HTML
========================================== */

function escapeHTML(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* ==========================================
   UPDATE SUMMARY
========================================== */

function updateSummary(){

    if(!selectedService)
        return;


    const balanceElement =
        document.getElementById(
            "summaryBalance"
        );


    balanceElement.innerText =
        formatFC(
            currentBalance
        ) +
        " FC";


    if(
        currentBalance <
        selectedService.price
    ){

        balanceElement.classList.add(
            "insufficient"
        );

    }
    else{

        balanceElement.classList.remove(
            "insufficient"
        );

    }

}

/* ==========================================
   ENVOYER COMMANDE
========================================== */

document.getElementById(
    "orderForm"
).addEventListener(

    "submit",

    async event=>{

        event.preventDefault();


        if(!selectedService){

            return;

        }


        const service =
            selectedService;


        const status =
            document.getElementById(
                "orderStatus"
            );


        const button =
            document.getElementById(
                "submitOrder"
            );


        /*
         * Vérification immédiate
         */

        if(
            currentBalance <
            service.price
        ){

            status.className =
                "status error";

            status.innerText =
                "❌ Solde insuffisant. Rechargez votre compte.";

            return;

        }


        /*
         * Désactiver le bouton
         */

        button.disabled =
            true;

        button.innerText =
            "⏳ TRAITEMENT...";


        status.className =
            "status";

        status.innerText =
            "Vérification du solde...";


        try{

            /* ==================================
               RÉCUPÉRER LE FORMULAIRE
            ================================== */

            const form =
                document.getElementById(
                    "orderForm"
                );


            const formData =
                new FormData(form);


            const details = {};


            for(
                const [key,value]
                of formData.entries()
            ){

                details[key] =
                    String(value).trim();

            }


            /* ==================================
               REVALIDATION DU SOLDE
            ================================== */

            const userSnapshot =
                await get(
                    userRef
                );


            if(
                !userSnapshot.exists()
            ){

                throw new Error(
                    "USER_NOT_FOUND"
                );

            }


            const userData =
                userSnapshot.val();


            const balance =
                Number(
                    userData.solde_principal
                ) || 0;


            if(
                balance <
                service.price
            ){

                throw new Error(
                    "SOLDE_INSUFFISANT"
                );

            }


            /* ==================================
               CRÉER ID COMMANDE
            ================================== */

            const ordersRef =
                ref(
                    db,
                    "commandes"
                );


            const newOrder =
                push(
                    ordersRef
                );


            const orderId =
                newOrder.key;


            /* ==================================
               DÉBITER LE SOLDE
            ================================== */

            const transactionResult =
                await runTransaction(

                    userRef,

                    data=>{

                        if(
                            data === null
                        ){

                            return;

                        }


                        const solde =
                            Number(
                                data.solde_principal
                            ) || 0;


                        if(
                            solde <
                            service.price
                        ){

                            return;

                        }


                        data.solde_principal =
                            solde -
                            service.price;


                        return data;

                    }

                );


            if(
                !transactionResult.committed
            ){

                throw new Error(
                    "SOLDE_INSUFFISANT"
                );

            }


            /* ==================================
               ENREGISTRER LA COMMANDE
            ================================== */

            try{

                await set(

                    newOrder,

                    {

                        id:
                            orderId,

                        telephone:
                            userPhone,

                        serviceId:
                            service.id,

                        service:
                            service.name,

                        prix:
                            service.price,

                        details:
                            details,

                        statut:
                            "En attente",

                        date:
                            new Date()
                            .toISOString(),

                        timestamp:
                            Date.now(),

                        remboursementEffectue:
                            false

                    }

                );

            }

            catch(
                orderError
            ){

                /*
                 * La commande n'a pas pu être
                 * enregistrée : restauration
                 * du solde.
                 */

                await runTransaction(

                    userRef,

                    data=>{

                        if(
                            data === null
                        ){

                            return;

                        }


                        const actual =
                            Number(
                                data.solde_principal
                            ) || 0;


                        data.solde_principal =
                            actual +
                            service.price;


                        return data;

                    }

                );


                throw orderError;

            }


            /* ==================================
               SUCCÈS
            ================================== */

            status.className =
                "status success";


            status.innerText =
                "✅ Commande envoyée avec succès !";


            button.innerText =
                "✅ COMMANDE ENVOYÉE";


            currentBalance -=
                service.price;


            document.getElementById(
                "balance"
            ).innerText =
                formatFC(
                    currentBalance
                );


            /*
             * Redirection
             */

            setTimeout(

                ()=>{

                    window.location.href =
                        "dashboard.html";

                },

                1500

            );


        }

        catch(error){

            console.error(
                "Erreur commande :",
                error
            );


            status.className =
                "status error";


            if(
                error.message ===
                "SOLDE_INSUFFISANT"
            ){

                status.innerText =
                    "❌ Solde insuffisant.";

            }

            else if(
                error.message ===
                "USER_NOT_FOUND"
            ){

                status.innerText =
                    "❌ Compte utilisateur introuvable.";

            }

            else{

                status.innerText =
                    "⚠️ Impossible d'envoyer la commande. Réessayez.";

            }


            button.disabled =
                false;


            button.innerText =
                "🛒 CONFIRMER LA COMMANDE";

        }

    }

);

</script>
