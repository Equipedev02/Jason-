<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>DAVBOT Business - Boutique</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#020817;
    color:white;
    font-family:Inter,sans-serif;
    padding-bottom:100px;
}

header{
    padding:25px 20px;
    background:#06152c;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

h1{
    margin-bottom:8px;
}

.subtitle{
    color:#8fa6c7;
    margin-bottom:25px;
}

.products{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.product{
    background:#061329;
    border:1px solid #12345e;
    border-radius:22px;
    overflow:hidden;
}

.product img{
    width:100%;
    height:180px;
    object-fit:cover;
    background:#091b35;
}

.content{
    padding:18px;
}

.content h3{
    margin-bottom:8px;
}

.description{
    color:#8fa5c4;
    font-size:13px;
    line-height:1.5;
    min-height:40px;
}

.price{
    margin:15px 0;
    color:#50a6ff;
    font-size:20px;
    font-weight:800;
}

.buy{
    width:100%;
    border:0;
    padding:13px;
    border-radius:12px;
    background:#087cff;
    color:white;
    font-weight:800;
    cursor:pointer;
}

.nav{
    position:fixed;
    bottom:15px;
    left:50%;
    transform:translateX(-50%);
    width:calc(100% - 30px);
    max-width:600px;
    background:rgba(5,20,43,.95);
    border:1px solid #194272;
    border-radius:20px;
    display:flex;
    justify-content:space-around;
    padding:10px;
}

.nav a{
    color:#91a7c6;
    text-decoration:none;
    padding:10px;
    font-size:12px;
}

@media(max-width:800px){
    .products{
        grid-template-columns:1fr;
    }
}

</style>

</head>

<body>

<header>
    <strong>DAVBOT Business</strong>
</header>

<main class="container">

    <h1>Boutique</h1>

    <p class="subtitle">
        Découvre nos produits et services.
    </p>

    <div id="products" class="products"></div>

</main>

<nav class="nav">

<a href="dash.html">Accueil</a>
<a href="shop.html">Boutique</a>
<a href="profil.html">Profil</a>

</nav>

<script type="module" src="./app.js"></script>

</body>
</html>
